<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>本地内容阅读器</title>
    <style>
        html {
            font-size: 16px;
        }
        :root {
            --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f0f4fa 50%, #f8fafc 100%);
            --card-bg: rgba(255, 255, 255, 0.72);
            --card-border: rgba(255,255,255,0.85);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: rgba(226, 232, 240, 0.6);
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --active-bg: rgba(79, 70, 229, 0.14);
            --shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
            --blur: 14px;
            --tag-tech:#2563eb;
            --tag-sport:#059669;
            --star-yellow:#eab308;
        }
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.70);
            --card-border: rgba(148,163,184,0.15);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border: rgba(148,163,184,0.18);
            --primary: #818cf8;
            --primary-light: #a5b4fc;
            --hover-bg: rgba(129, 140, 248, 0.12);
            --active-bg: rgba(129, 140, 248, 0.20);
            --shadow: 0 10px 40px rgba(0,0,0,0.35);
        }
        [data-theme="eye"] {
            --bg-gradient: linear-gradient(135deg,#f7ecd4 0%,#f3e5c3 50%,#efe0b8 100%);
            --card-bg: rgba(255,250,235,0.78);
            --card-border: rgba(196,168,110,0.35);
            --text-main: #4a3b25;
            --text-sub: #8a744f;
            --border: rgba(196,168,110,0.4);
            --primary: #b4762a;
            --primary-light: #d19a4d;
            --hover-bg: rgba(180,118,42,0.10);
            --active-bg: rgba(180,118,42,0.16);
            --shadow: 0 10px 40px rgba(120,90,40,0.15);
        }
        /*夜间模式下图片降亮度，避免刺眼*/
        [data-theme="dark"] .art-content img {
            filter: brightness(0.75) contrast(0.95);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 44px 20px;
            transition: background 0.4s ease, color 0.4s ease;
            font-size: 1rem;
        }
        .header-wrap {
            max-width: 1200px;
            margin: 0 auto 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap:16px;
        }
        .main-title {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(90deg,var(--primary),var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 0.6px;
        }
        .header-right{
            display:flex;
            gap:12px;
            align-items:center;
        }
        .weather-box{
            padding:0.5rem 0.875rem;
            border-radius:0.75rem;
            border:1px solid var(--border);
            background:var(--card-bg);
            backdrop-filter: blur(var(--blur));
            font-size:0.875rem;
            color:var(--text-main);
            display:flex;
            align-items:center;
            gap:0.5rem;
            user-select:none;
        }
        #themeBtn {
            padding:0.5rem 0.875rem;
            border-radius:0.75rem;
            border: 1px solid var(--border);
            background: var(--card-bg);
            backdrop-filter: blur(var(--blur));
            color: var(--text-main);
            cursor: pointer;
            font-size:0.875rem;
            transition: all 0.3s ease;
        }
        #themeBtn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .search-wrap{
            max-width:1200px;
            margin:0 auto 14px;
        }
        #searchInput{
            width:100%;
            padding:0.625rem 1rem;
            border-radius:0.75rem;
            border:1px solid var(--border);
            background:var(--card-bg);
            backdrop-filter: blur(var(--blur));
            color:var(--text-main);
            font-size:0.875rem;
            outline:none;
        }
        #searchInput::placeholder{
            color:var(--text-sub);
        }
        .tab-wrap{
            max-width:1200px;
            margin:0 auto 12px;
            display:flex;
            gap:0.625rem;
            flex-wrap:wrap;
        }
        .tab-btn{
            padding:0.5rem 1rem;
            border-radius:0.625rem;
            border:1px solid var(--border);
            background:var(--card-bg);
            backdrop-filter: blur(var(--blur));
            color:var(--text-main);
            cursor:pointer;
            transition:0.25s;
            font-size:0.875rem;
        }
        .tab-btn.active{
            background:var(--primary);
            color:#fff;
            border-color:var(--primary);
        }
        .tool-wrap{
            max-width:1200px;
            margin:0 auto 20px;
            display:flex;
            flex-wrap:wrap;
            align-items:center;
            position:relative;
        }
        .tool-box-toggle{
            padding:0.375rem 0.875rem;
            border-radius:0.5rem;
            border:1px solid var(--border);
            background:var(--card-bg);
            backdrop-filter: blur(var(--blur));
            color:var(--text-main);
            font-size:0.8125rem;
            cursor:pointer;
            transition: all 0.18s ease;
            display:flex;
            align-items:center;
            gap:0.3rem;
            margin-right:0.5rem;
        }
        .tool-box-toggle:hover{
            border-color:var(--primary);
            color:var(--primary);
        }
        .tool-box-toggle.active{
            background:var(--primary);
            color:#fff;
            border-color:var(--primary);
        }
        .tool-arrow{
            display:inline-block;
            margin-left:0.3rem;
            font-size:0.6875rem;
            transition:transform 0.25s ease;
            transform:rotate(0deg);
        }
        .tool-box-toggle.active .tool-arrow{
            transform:rotate(180deg);
        }
        .tool-panel{
            display:none;
            width:100%;
            gap:0.5rem;
            flex-wrap:wrap;
            align-items:center;
            margin-top:0.5rem;
            padding-top:0.5rem;
            border-top:1px dashed var(--border);
            animation: fadeIn 0.2s ease;
        }
        .tool-panel.open{
            display:flex;
        }
        @keyframes fadeIn{
            from{ opacity:0; transform: translateY(-4px); }
            to{ opacity:1; transform: translateY(0); }
        }
        .tool-btn{
            padding:0.375rem 0.75rem;
            border-radius:0.5rem;
            border:1px solid var(--border);
            background:var(--card-bg);
            backdrop-filter: blur(var(--blur));
            color:var(--text-main);
            font-size:0.8125rem;
            cursor:pointer;
            transition: all 0.18s ease;
        }
        .tool-btn:active{
            transform: scale(0.96);
            filter: brightness(0.92);
        }
        .font-group{
            display:flex;
            gap:0.25rem;
            margin-left:0.625rem;
        }
        .font-btn{
            padding:0.25rem 0.625rem;
            border-radius:0.375rem;
            border:1px solid var(--border);
            background:var(--card-bg);
            color:var(--text-main);
            cursor:pointer;
            font-size:0.75rem;
            transition:0.18s;
        }
        .font-btn:active{
            transform: scale(0.96);
        }
        .font-btn.active{
            background:var(--primary);
            color:#fff;
            border-color:var(--primary);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 1.75rem;
            transition: all 0.35s ease;
        }
        .left-sidebar {
            width: 23rem;
            background: var(--card-bg);
            backdrop-filter: blur(var(--blur));
            border: 1px solid var(--card-border);
            border-radius: 1.25rem;
            box-shadow: var(--shadow);
            padding:1.375rem;
            height: 80vh;
            overflow-y: auto;
            position: relative;
            transition: all 0.35s ease;
        }
        .left-sidebar.hide-sidebar{
            width:0;
            padding:0;
            border:none;
            opacity:0;
            overflow:hidden;
        }
        .sidebar-title {
            font-size:1.125rem;
            font-weight: 600;
            padding-bottom:0.75rem;
            border-bottom: 1px solid var(--border);
            margin-bottom:0.5rem;
            display: flex;
            align-items: center;
            gap:0.5rem;
            color:var(--text-main);
        }
        .stat-info{
            font-size:0.78125rem;
            color:var(--text-sub);
            margin-bottom:1rem;
        }
        .list-loading{
            position:absolute;
            inset:0;
            background:rgba(0,0,0,0.08);
            border-radius:1.25rem;
            display:flex;
            align-items:center;
            justify-content:center;
            color:var(--text-main);
            font-size:0.9rem;
            opacity:0;
            pointer-events:none;
            transition:opacity 0.22s ease;
            z-index:5;
        }
        .list-loading.show{
            opacity:1;
            pointer-events:auto;
        }
        .news-item {
            padding:1rem 0.9375rem;
            border-radius:0.875rem;
            margin-bottom:0.6875rem;
            cursor: pointer;
            transition: all 0.28s cubic‑bezier(0.4,0,0.2,1);
            border: 1px solid transparent;
            position:relative;
            color:var(--text-main);
        }
        .news-item:hover {
            background: var(--hover-bg);
            transform: translateY(-2px) scale(1.01);
        }
        .news-item.active {
            background: var(--active-bg);
            border-color: var(--primary);
        }
        .item-title {
            font-size:0.96875rem;
            line-height: 1.6;
            margin-bottom:0.375rem;
            padding-right:1.5rem;
            color:var(--text-main);
        }
        .item-title.read{
            color:var(--text-sub);
        }
        .item-time{
            font-size:0.75rem;
            color:var(--text-sub);
            margin:0.25rem 0;
        }
        .item-tag{
            font-size:0.75rem;
            padding:0.125rem 0.5rem;
            border-radius:0.375rem;
            display:inline-block;
            color:#fff;
        }
        .tag-tech{background:var(--tag-tech);}
        .tag-sport{background:var(--tag-sport);}
        .star-btn{
            position:absolute;
            top:0.75rem;
            right:0.75rem;
            font-size:1.125rem;
            cursor:pointer;
            user-select:none;
            transition:0.2s;
            color:var(--text-sub);
        }
        .star-btn.star-active{
            color:var(--star-yellow);
        }
        .no-match{
            text-align:center;
            color:var(--text-sub);
            padding:1.875rem 0;
            font-size:0.875rem;
        }
        .right-article {
            flex: 1;
            background: var(--card-bg);
            backdrop-filter: blur(var(--blur));
            border: 1px solid var(--card-border);
            border-radius:1.25rem;
            box-shadow: var(--shadow);
            padding:2.625rem 3rem;
            height: 80vh;
            overflow-y: auto;
            color:var(--text-main);
            position:relative;
        }
        /*阅读进度条*/
        .read-progress-bar{
            position:absolute;
            top:0;
            left:0;
            height:4px;
            background:var(--primary);
            width:0%;
            border-radius:0 2px 2px 0;
            z-index:2;
        }
        .article-tool-bar{
            display:flex;
            gap:8px;
            margin-bottom:1rem;
            flex-wrap:wrap;
        }
        .back-btn{
            display:none;
            margin-bottom:1.25rem;
            padding:0.375rem 0.75rem;
            border:1px solid var(--border);
            border-radius:0.5rem;
            background:var(--card-bg);
            color:var(--text-main);
            cursor:pointer;
            font-size:0.875rem;
        }
        .back-btn.show{
            display:block;
        }
        .empty-tip {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            font-size:1.125rem;
            gap:0.625rem;
        }
        .art-title {
            font-size:1.875rem;
            line-height: 1.42;
            margin-bottom:0.75rem;
            font-weight:700;
            color:var(--text-main);
        }
        .art-tag{
            display:inline-block;
            font-size:0.8125rem;
            padding:0.1875rem 0.625rem;
            border-radius:0.4375rem;
            color:#fff;
            margin-bottom:0.5rem;
        }
        .art-time{
            font-size:0.875rem;
            color:var(--text-sub);
            margin-bottom:0.875rem;
        }
        .art-meta {
            font-size:0.90625rem;
            color: var(--text-sub);
            padding-bottom:1.25rem;
            border-bottom: 1px solid var(--border);
            margin-bottom:1.75rem;
        }
        .art-meta a {
            color: var(--primary);
            text-decoration: none;
        }
        .art-meta a:hover {
            text-decoration: underline;
        }
        .art-content {
            font-size:1.0625rem;
            line-height: var(--art-lh, 2.0);
            letter-spacing: var(--art-ls, 0px);
            font-family: var(--art-ff, inherit);
            color:var(--text-main);
            user-select: text;
            -webkit-user-select: text;
            -webkit-touch-callout: default;
            word-break: break-word;
        }
        .art-content p {
            margin-bottom:1.125rem;
        }
        /*正文容器内样式隔离：仅作用于文章内容，不污染外部页面*/
        .art-content h1,.art-content h2,.art-content h3,.art-content h4,.art-content h5,.art-content h6{
            margin:1.4em 0 0.6em;
            line-height:1.45;
            color:var(--text-main);
            font-weight:600;
        }
        .art-content h1{font-size:1.6em;}
        .art-content h2{font-size:1.45em;}
        .art-content h3{font-size:1.3em;}
        .art-content h4{font-size:1.15em;}
        .art-content h5,.art-content h6{font-size:1.05em;}
        .art-content img{
            max-width:100%;
            height:auto;
            border-radius:0.5rem;
            margin:0.5rem 0;
            display:block;
        }
        .art-content ul,.art-content ol{
            padding-left:1.5em;
            margin:0.75em 0;
        }
        .art-content li{ margin:0.35em 0; }
        .art-content blockquote{
            border-left:3px solid var(--primary);
            padding:0.4em 1em;
            margin:0.9em 0;
            color:var(--text-sub);
            background:var(--hover-bg);
            border-radius:0 0.4rem 0.4rem 0;
        }
        .art-content a{ color:var(--primary); }
        .art-content strong{ color:var(--text-main); }
        .art-content table{
            border-collapse:collapse;
            max-width:100%;
            display:block;
            overflow-x:auto;
            margin:0.9em 0;
        }
        .art-content th,.art-content td{
            border:1px solid var(--border);
            padding:0.4em 0.7em;
            font-size:0.95em;
        }
        .art-content pre,.art-content code{
            font-family:Consolas,"Courier New",monospace;
            background:var(--hover-bg);
            border-radius:4px;
        }
        .art-content code{ padding:0.1em 0.35em; }
        .art-content pre{ padding:0.8em 1em; overflow-x:auto; margin:0.9em 0; }
        #backTop{
            position:fixed;
            bottom:1.5rem;
            right:1.5rem;
            width:2.75rem;
            height:2.75rem;
            border-radius:50%;
            border:1px solid var(--border);
            background:var(--card-bg);
            backdrop-filter: blur(var(--blur));
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:1.125rem;
            color:var(--text-main);
            cursor:pointer;
            box-shadow:var(--shadow);
            opacity:0;
            pointer-events:none;
            transition:0.3s;
            z-index:999;
        }
        #backTop.show{
            opacity:1;
            pointer-events:auto;
        }
        #listBackTop{
            position:absolute;
            bottom:1rem;
            right:1rem;
            width:2.375rem;
            height:2.375rem;
            border-radius:50%;
            border:1px solid var(--border);
            background:var(--card-bg);
            backdrop-filter: blur(var(--blur));
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:1rem;
            color:var(--text-main);
            cursor:pointer;
            box-shadow:var(--shadow);
            opacity:0;
            pointer-events:none;
            transition:0.3s;
            z-index:10;
        }
        #listBackTop.show{
            opacity:1;
            pointer-events:auto;
        }
        /*toast提示*/
        .toast{
            position:fixed;
            left:50%;
            transform:translateX(-50%);
            bottom:28px;
            padding:10px 18px;
            border-radius:8px;
            background:rgba(0,0,0,0.72);
            color:#fff;
            font-size:0.875rem;
            z-index:9999;
            opacity:0;
            transition:opacity 0.25s;
            pointer-events:none;
        }
        .toast.show{
            opacity:1;
        }
        /*浏览历史小面板*/
        .history-panel{
            max-width:1200px;
            margin:8px auto 16px;
        }
        .history-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:6px;
        }
        .history-title{
            font-size:0.8125rem;
            color:var(--text-sub);
        }
        .history-clear-btn{
            font-size:0.75rem;
            padding:2px 8px;
            border-radius:4px;
            border:1px solid var(--border);
            background:var(--card-bg);
            color:var(--text-sub);
            cursor:pointer;
        }
        .history-items{
            display:flex;
            gap:6px;
            flex-wrap:wrap;
        }
        .history-item{
            font-size:0.78125rem;
            padding:4px 24px 4px 10px;
            border-radius:6px;
            border:1px solid var(--border);
            background:var(--card-bg);
            backdrop-filter: blur(var(--blur));
            cursor:pointer;
            max-width:180px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            position:relative;
        }
        .history-item-close{
            position:absolute;
            right:4px;
            top:2px;
            font-size:0.85rem;
            color:var(--text-sub);
            cursor:pointer;
            width:16px;
            height:16px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        ::-webkit-scrollbar { width:0.5625rem; height:0.5625rem; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius:0.375rem; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-sub); }
        .disclaimer-wrap{
            max-width:1200px;
            margin:2rem auto 0.625rem;
            padding:1.25rem 1.5rem;
            background:var(--card-bg);
            backdrop-filter: blur(var(--blur));
            border:1px solid var(--card-border);
            border-radius:1rem;
            box-shadow:var(--shadow);
            font-size:0.8125rem;
            color:var(--text-sub);
            line-height:1.7;
        }
        .disclaimer-wrap h4{
            font-size:0.875rem;
            color:var(--text-main);
            margin-bottom:0.5rem;
        }
        /* ===== 阅读增强 V2 ===== */
        /*进度条加高便于点击，点击顶部可跳转阅读位置*/
        .read-progress-bar{
            height:6px;
            cursor:pointer;
        }
        /*滚动时显示的阅读百分比气泡*/
        .read-pct-badge{
            position:fixed;
            z-index:9998;
            padding:2px 10px;
            border-radius:10px;
            background:var(--primary);
            color:#fff;
            font-size:0.75rem;
            opacity:0;
            transition:opacity 0.3s;
            pointer-events:none;
        }
        .read-pct-badge.show{ opacity:1; }
        /*行距/字距/字体设置区*/
        .reader-setting{
            display:flex;
            gap:0.875rem;
            align-items:center;
            flex-wrap:wrap;
            margin-left:0.625rem;
            font-size:0.8125rem;
            color:var(--text-sub);
        }
        .reader-setting label{ display:flex; align-items:center; gap:0.3rem; }
        .reader-setting input[type="range"]{
            width:5.5rem;
            accent-color:var(--primary);
            cursor:pointer;
        }
        .reader-setting select{
            padding:0.25rem 0.5rem;
            border-radius:0.375rem;
            border:1px solid var(--border);
            background:var(--card-bg);
            color:var(--text-main);
            font-size:0.8125rem;
            cursor:pointer;
        }
        /*文章工具条：文内搜索框*/
        .art-search-box{
            display:flex;
            align-items:center;
            gap:0.375rem;
            margin-left:auto;
            flex-wrap:wrap;
        }
        .art-search-box input{
            padding:0.3rem 0.6rem;
            border-radius:0.5rem;
            border:1px solid var(--border);
            background:var(--card-bg);
            color:var(--text-main);
            font-size:0.8125rem;
            width:9.5rem;
            outline:none;
        }
        .art-search-count{
            font-size:0.75rem;
            color:var(--text-sub);
            white-space:nowrap;
        }
        /*文内搜索高亮*/
        mark.hl{
            background:rgba(250,204,21,0.55);
            color:inherit;
            border-radius:3px;
            padding:0 1px;
        }
        mark.hl.current{
            background:#f59e0b;
            color:#fff;
        }
        /*文章目录侧边栏（可折叠）*/
        .toc-panel{
            position:absolute;
            top:3.2rem;
            right:0.75rem;
            width:15rem;
            max-height:70%;
            overflow-y:auto;
            background:var(--card-bg);

<script>
// ===== 天气模块：存储 7 个城市当天实况，按 IP 定位自动匹配所在城市 =====
const WEATHER_DATA = {
    date:"2026-08-31",       // 数据抓取日期（当天）
    time:"21:00",            // 实况时间
    cities:[
        {name:"北京",   en:["beijing"],            lat:39.9042, lon:116.4074, temp:24.7, code:0,  humid:69, feels:27.6, wind:2.3},
        {name:"上海",   en:["shanghai"],           lat:31.2304, lon:121.4737, temp:26.4, code:51, humid:96, feels:33.3, wind:1.5},
        {name:"广州",   en:["guangzhou"],          lat:23.1291, lon:113.2644, temp:25.9, code:80, humid:97, feels:31.5, wind:9.5},
        {name:"沈阳",   en:["shenyang"],           lat:41.8057, lon:123.4315, temp:20.3, code:0,  humid:70, feels:19.9, wind:12.9},
        {name:"哈尔滨", en:["harbin"],             lat:45.8038, lon:126.5350, temp:16.1, code:0,  humid:89, feels:16.8, wind:4.4},
        {name:"南京",   en:["nanjing"],            lat:32.0603, lon:118.7969, temp:24.6, code:3,  humid:87, feels:27.9, wind:11.6},
        {name:"盘锦",   en:["panjin"],             lat:41.1245, lon:122.0706, temp:22.2, code:0,  humid:62, feels:21.7, wind:12.9}
    ]
};
// WMO 天气码 → 中文描述 + 图标
const WMO_MAP = {
    0:["晴","☀️"], 1:["晴间多云","🌤️"], 2:["多云","⛅"], 3:["阴","☁️"],
    45:["雾","🌫️"], 48:["冻雾","🌫️"],
    51:["小毛毛雨","🌦️"], 53:["毛毛雨","🌦️"], 55:["大毛毛雨","🌦️"],
    56:["冻毛毛雨","🌧️"], 57:["强冻毛毛雨","🌧️"],
    61:["小雨","🌧️"], 63:["中雨","🌧️"], 65:["大雨","🌧️"],
    66:["冻雨","🌧️"], 67:["强冻雨","🌧️"],
    71:["小雪","❄️"], 73:["中雪","❄️"], 75:["大雪","❄️"], 77:["米雪","❄️"],
    80:["阵雨","🌦️"], 81:["强阵雨","🌧️"], 82:["暴雨","⛈️"],
    85:["阵雪","🌨️"], 86:["强阵雪","🌨️"],
    95:["雷阵雨","⛈️"], 96:["雷阵雨伴冰雹","⛈️"], 99:["强雷暴伴冰雹","⛈️"]
};
// 夜晚（19:00-06:00）时晴天用月亮图标
function weatherIcon(code, hour){
    const hit = WMO_MAP[code] || ["未知","🌡️"];
    if(code === 0 && (hour >= 19 || hour < 6)) return "🌙";
    return hit[1];
}
function weatherText(code){
    const hit = WMO_MAP[code] || ["未知"];
    return hit[0];
}
function renderWeather(cityObj){
    const hour = parseInt((WEATHER_DATA.time || "12:00").split(":")[0], 10);
    document.getElementById("weatherIcon").innerText = weatherIcon(cityObj.code, hour);
    document.getElementById("weatherText").innerText =
        `${cityObj.name}｜${weatherText(cityObj.code)}｜${Math.round(cityObj.temp)}℃`;
    document.getElementById("weatherBox").title =
        `IP 定位城市：${cityObj.name}（${WEATHER_DATA.date} ${WEATHER_DATA.time} 实况）\n` +
        `气温 ${cityObj.temp}℃｜体感 ${cityObj.feels}℃｜湿度 ${cityObj.humid}%｜风速 ${cityObj.wind} km/h`;
}
// 根据经纬度取距离最近的城市（IP 定位结果不在列表内时的兜底）
function nearestCity(lat, lon){
    const R = 6371, rad = d=>d*Math.PI/180;
    let best = WEATHER_DATA.cities[0], bestD = Infinity;
    WEATHER_DATA.cities.forEach(c=>{
        const dLat = rad(c.lat-lat), dLon = rad(c.lon-lon);
        const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat))*Math.cos(rad(c.lat))*Math.sin(dLon/2)**2;
        const d = 2*R*Math.asin(Math.sqrt(a));
        if(d < bestD){ bestD = d; best = c; }
    });
    return best;
}
// 通过 IP 判断所在城市：先按名称精确匹配，匹配不到则取地理位置最近的城市
function detectCityByIP(){
    const fallback = ()=>{ renderWeather(WEATHER_DATA.cities[0]); };  // 定位失败时兜底北京
    let settled = false;
    const timer = setTimeout(()=>{ if(!settled){ settled = true; fallback(); } }, 4000);
    try{
        fetch("http://ip-api.com/json/?fields=status,country,regionName,city,lat,lon&lang=zh-CN")
        .then(r=>r.json())
        .then(d=>{
            if(settled || !d || d.status !== "success") return;
            settled = true; clearTimeout(timer);
            const cityStr = (d.city||"") + (d.regionName||"");
            const lowStr = cityStr.toLowerCase();
            let hit = WEATHER_DATA.cities.find(c=> cityStr.includes(c.name));
            if(!hit){
                hit = WEATHER_DATA.cities.find(c=> c.en.some(e=> lowStr.includes(e)));
            }
            if(!hit && typeof d.lat === "number" && typeof d.lon === "number"){
                hit = nearestCity(d.lat, d.lon);
            }
            renderWeather(hit || WEATHER_DATA.cities[0]);
        })
        .catch(()=>{ if(!settled){ settled = true; clearTimeout(timer); fallback(); } });
    }catch(e){
        if(!settled){ settled = true; clearTimeout(timer); fallback(); }
    }
}
// 初始化：每次打开都强制按 IP 定位显示所在城市
(function initWeather(){
    localStorage.removeItem("news_reader_weather_city");  // 清理旧版手动选择城市的遗留数据
    const hour = parseInt((WEATHER_DATA.time||"12:00").split(":")[0], 10);
    document.getElementById("weatherIcon").innerText = weatherIcon(0, hour);
    document.getElementById("weatherText").innerText = "定位中…";
    detectCityByIP();
})();

<p>整套证明通过Lean 4形式化验证，零sorry零admit一步未跳，代码已在GitHub公开，验证链为GPT构造证明、Codex翻译Lean 4、编译器逐行终审三段接力。</p>

//防抖工具：减少滚动/输入等高频事件的重绘与存储压力
function debounce(fn, wait){
    let t = null;
    return function(...args){
        clearTimeout(t);
        t = setTimeout(()=>fn.apply(this, args), wait);
    };
}

//正文纯文本长度（用于阅读时长估算）
function plainLen(html){
    return html.replace(/<[^>]+>/g,"").replace(/\s+/g,"").length;
}


//文内搜索：清除高亮
function clearArticleMarks(){
    const root = document.getElementById("articleContentDom");
    if(!root) return;
    root.querySelectorAll("mark.hl").forEach(m=>{
        const p = m.parentNode;
        if(!p) return;
        while(m.firstChild) p.insertBefore(m.firstChild, m);
        m.remove();
        p.normalize();
    });
}


//文内搜索：在高亮结果间跳转
function stepArticleMatch(dir){
    if(!artSearchMatches.length) return;
    if(artSearchCursor >= 0) artSearchMatches[artSearchCursor].classList.remove("current");
    artSearchCursor = (artSearchCursor + dir + artSearchMatches.length) % artSearchMatches.length;
    const cur = artSearchMatches[artSearchCursor];
    cur.classList.add("current");
    cur.scrollIntoView({ block:"center" });
}


//文内搜索：绑定输入与跳转按钮
function bindArticleSearch(){
    const input = document.getElementById("artSearchInput");
    if(!input) return;
    const doSearch = debounce(()=>{
        const kw = input.value.trim();
        clearArticleMarks();
        artSearchMatches = [];
        artSearchCursor = -1;
        const cnt = document.getElementById("artSearchCount");
        if(!kw){
            if(cnt) cnt.innerText = "";
            return;
        }
        const root = document.getElementById("articleContentDom");
        if(!root) return;
        const lkw = kw.toLowerCase();
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
            acceptNode(n){
                if(!n.textContent || !n.textContent.trim()) return NodeFilter.FILTER_REJECT;
                if(n.parentNode && n.parentNode.nodeName === "MARK") return NodeFilter.FILTER_REJECT;
                return n.textContent.toLowerCase().includes(lkw) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
            }
        });
        const hits = [];
        while(walker.nextNode()) hits.push(walker.currentNode);
        hits.forEach(n=>{
            const text = n.textContent;
            const lower = text.toLowerCase();
            let idx = lower.indexOf(lkw), last = 0;
            const frag = document.createDocumentFragment();
            while(idx !== -1){
                if(idx > last) frag.appendChild(document.createTextNode(text.slice(last, idx)));
                const m = document.createElement("mark");
                m.className = "hl";
                m.textContent = text.slice(idx, idx + kw.length);
                frag.appendChild(m);
                last = idx + kw.length;
                idx = lower.indexOf(lkw, last);
            }
            if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
            n.parentNode.replaceChild(frag, n);
        });
        artSearchMatches = [...root.querySelectorAll("mark.hl")];
        if(cnt) cnt.innerText = artSearchMatches.length ? (artSearchMatches.length + "处") : "无匹配";
    },200);
    input.addEventListener("input", doSearch);
    document.getElementById("artSearchPrev").onclick = ()=>stepArticleMatch(-1);
    document.getElementById("artSearchNext").onclick = ()=>stepArticleMatch(1);
    input.addEventListener("keydown", e=>{
        if(e.key === "Enter"){
            e.preventDefault();
            stepArticleMatch(1);
        }
    });
}


//生成文章目录：优先解析 h1-h6；无标题时按段落分组生成概要目录
function buildTocFor(nodes, getCursor, loadMore){
    const tocBody = document.getElementById("tocBody");
    if(!tocBody) return;
    tocBody.innerHTML = "";
    const heads = nodes.filter(n=>n.nodeType===1 && /^H[1-6]$/.test(n.tagName));
    const entries = [];
    if(heads.length >= 2){
        heads.forEach((h,i)=>{
            h.id = "toc-head-" + i;
            entries.push({ id:h.id, text:(h.innerText || "").trim() || ("标题" + (i+1)), level:+h.tagName[1] });
        });
    }else{
        let group = 0, cnt = 0;
        nodes.forEach(n=>{
            if(n.nodeType===1 && n.tagName === "P"){
                if(cnt % 4 === 0){
                    n.id = "toc-para-" + group;
                    const t = (n.innerText || "").trim().replace(/\s+/g," ");
                    entries.push({ id:n.id, text:t.slice(0,22) + (t.length > 22 ? "…" : ""), level:2 });
                    group++;
                }
                cnt++;
            }
        });
    }
    if(!entries.length){
        const empty = document.createElement("div");
        empty.className = "toc-item";
        empty.style.color = "var(--text-sub)";
        empty.innerText = "（本文较短，无目录）";
        tocBody.appendChild(empty);
        return;
    }
    entries.forEach(en=>{
        const d = document.createElement("div");
        d.className = "toc-item toc-l" + en.level;
        d.innerText = en.text;
        d.title = en.text;
        d.onclick = ()=>{
            //懒加载场景：目标段落可能尚未渲染，先补齐内容
            let guard = 0;
            while(!document.getElementById(en.id) && getCursor() < nodes.length && guard++ < 200) loadMore();
            const el = document.getElementById(en.id);
            if(el) el.scrollIntoView({ block:"start" });
        };
        tocBody.appendChild(d);
    });
}


function openArticleByAid(aid){

    const idx = articleData.findIndex(x=>x.title === title);

    const item = articleData[idx];

    r.add(aid);
    saveReadSet(r);
    currentArticleId = aid;
    localStorage.setItem(LAST_ART_KEY,JSON.stringify({aid:aid}));

    const readMin = Math.max(1, Math.round(plainLen(item.content)/400));
    detailBox.innerHTML = `

        <button class="back-btn show" id="goBackBtn">← 返回列表</button>
        <div class="article-tool-bar">

        </div>

    const nodes = [...tmp.childNodes].filter(n=>n.nodeType===1 || (n.nodeType===3 && n.textContent.trim()));
    const CHUNK = 25;
    const lazy = nodes.length > CHUNK + 10;
    let cursorIdx = 0;
    const sentinel = document.createElement("div");
    sentinel.className = "lazy-sentinel";
    sentinel.innerText = "⏬ 继续下拉加载剩余内容…";
    let lazyObserver = null;
    function appendChunk(){
        const end = Math.min(cursorIdx + CHUNK, nodes.length);
        const frag = document.createDocumentFragment();
        for(; cursorIdx < end; cursorIdx++) frag.appendChild(nodes[cursorIdx]);
        if(sentinel.parentNode === contentDom){
            contentDom.insertBefore(frag, sentinel);
        }else{
            contentDom.appendChild(frag);
        }
        if(cursorIdx >= nodes.length){
            sentinel.remove();
            if(lazyObserver) lazyObserver.disconnect();
        }
    }
    if(lazy){
        contentDom.appendChild(sentinel);
        appendChunk();
        lazyObserver = new IntersectionObserver((ents)=>{
            if(ents.some(en=>en.isIntersecting)) appendChunk();
        },{ root: detailBox, rootMargin:"700px" });
        lazyObserver.observe(sentinel);
    }else{
        appendChunk();
    }
    //===== 目录（可折叠侧边栏） =====
    const tocPanel = document.getElementById("tocPanel");
    document.getElementById("tocToggleBtn").onclick = ()=>{
        tocPanel.classList.toggle("open");
    };
    buildTocFor(nodes, ()=>cursorIdx, appendChunk);
    //===== 上一篇 / 下一篇翻页 =====
    const pos = currentListAids.indexOf(aid);
    const prevBtn = document.getElementById("prevArtBtn");
    const nextBtn = document.getElementById("nextArtBtn");
    prevBtn.disabled = pos <= 0;
    nextBtn.disabled = pos === -1 || pos >= currentListAids.length - 1;
    prevBtn.onclick = ()=>{ if(pos > 0) openArticleByAid(currentListAids[pos-1]); };
    nextBtn.onclick = ()=>{ if(pos >= 0 && pos < currentListAids.length-1) openArticleByAid(currentListAids[pos+1]); };
    //===== 书签：保存当前阅读位置 =====
    document.getElementById("setBookmarkBtn").onclick = ()=>{
        localStorage.setItem(BKMK_KEY, JSON.stringify({
            aid: aid,
            title: item.title,
            scrollTop: detailBox.scrollTop,
            time: Date.now()
        }));
        showToast("已保存书签，可随时用“📍跳转书签”返回此处");
    };
    //===== 文内搜索 =====
    bindArticleSearch();
    //===== 恢复上次阅读位置（懒加载时先补齐内容再定位） =====
    const posMap = getScrollPos();
    const savedTop = posMap[aid] || 0;
    setTimeout(()=>{
        let guard = 0;
        while(lazy && cursorIdx < nodes.length && detailBox.scrollHeight - detailBox.clientHeight <= savedTop && guard++ < 200){
            appendChunk();
        }
        detailBox.scrollTop = savedTop;
        updateProgress();
    },30);
    renderList();
}


function renderList(){
    const readSet = getReadSet();
    const starSet = getStarSet();
    updateStat();
    const kw = searchInput.value.trim().toLowerCase();
    let arr = articleData;
    if(currentCat !== "all"){
        if(currentCat === "star"){
            arr = arr.filter((it,idx)=> starSet.has(idx+"_"+it.title));
        }else if(currentCat === "unread"){
            arr = arr.filter((it,idx)=> !readSet.has(idx+"_"+it.title));
        }else{
            arr = arr.filter(it=> it.category === currentCat);
        }
    }
    if(kw){
        arr = arr.filter(it=> it.title.toLowerCase().includes(kw));
    }
    if(currentCat === "all"){
        // “全部”视图分组显示：上半部分AI(tech)，下半部分体育(sport)，组内保持原有顺序
        arr = arr.slice().sort((a,b)=>(a.category==="tech"?0:1)-(b.category==="tech"?0:1));
    }
    //记录当前展示顺序，供“上一篇/下一篇”翻页使用
    currentListAids = arr.map(it=>{
        const realIdx = articleData.findIndex(x=>x.title === it.title);
        return realIdx + "_" + it.title;
    });
    listBox.innerHTML = "";
    if(arr.length === 0){
        listBox.innerHTML = `<div class="no-match">暂无匹配文章</div>`;
        return;
    }
    arr.forEach(item=>{
        const realIdx = articleData.findIndex(x=>x.title === item.title);
        const aid = realIdx + "_" + item.title;
        const div = document.createElement("div");
        div.className = "news-item";
        const isRead = readSet.has(aid);
        const isStar = starSet.has(aid);
        div.innerHTML = `
            <div class="star-btn ${isStar?"star-active":""}">${isStar?"⭐":"☆"}</div>
            <div class="item-title ${isRead?"read":""}">${item.title}</div>
            <div class="item-time">🕒 ${item.pubTime}</div>
            <span class="item-tag ${item.category==="tech"?"tag-tech":"tag-sport"}">${item.category==="tech"?"科技":"体育"}</span>
        `;
        const starDom = div.querySelector(".star-btn");
        starDom.onclick = (e)=>{
            e.stopPropagation();
            const s = getStarSet();
            if(s.has(aid)) s.delete(aid);
            else s.add(aid);
            saveStarSet(s);
            renderList();
        };
        div.onclick = ()=>{
            openArticleByAid(aid);
        };
        listBox.appendChild(div);
    });
}


document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.onclick = ()=>{
        document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        currentCat = btn.dataset.cat;
        currentArticleId = null;
        localStorage.removeItem(LAST_ART_KEY);
        detailBox.innerHTML = `
            <div class="read-progress-bar" id="progressBar"></div>
            <div class="empty-tip">
                <span>👈 点击左侧标题阅读文章</span>
                <span style="font-size:0.875rem;">仅本地个人学习使用</span>
            </div>
        `;
        renderList();
    }
});
const searchRenderDebounced = debounce(()=>{
    currentArticleId = null;
    localStorage.removeItem(LAST_ART_KEY);
    detailBox.innerHTML = `
        <div class="read-progress-bar" id="progressBar"></div>
        <div class="empty-tip">
            <span>👈 点击左侧标题阅读文章</span>
            <span style="font-size:0.875rem;">仅本地个人学习使用</span>
        </div>
    `;
    renderList();
},160);
searchInput.oninput = searchRenderDebounced;


document.getElementById("markAllRead").onclick = ()=>{
    if(window.confirm("确定全部标为已读？")){
        const s = getReadSet();
        articleData.forEach((it,i)=> s.add(i+"_"+it.title));
        saveReadSet(s);
        renderList();
        showToast("已全部标记已读");
    }
};


//跳转到书签：一键回到保存过阅读位置的文章
document.getElementById("jumpBookmarkBtn").onclick = function(){
    const raw = localStorage.getItem(BKMK_KEY);
    if(!raw){
        showToast("暂无书签，请先在文章内点“🔖存书签”");
        return;
    }
    try{
        const b = JSON.parse(raw);
        const idx = articleData.findIndex(x=>x.title === (b.aid.split("_").slice(1).join("_")));
        if(idx === -1){
            showToast("书签对应文章已不存在");
            return;
        }
        //把书签位置写入滚动记录，交由打开流程做懒加载补齐与定位
        const pos = getScrollPos();
        pos[b.aid] = b.scrollTop || 0;
        saveScrollPos(pos);
        openArticleByAid(b.aid);
        showToast("已跳转到书签位置");
    }catch(e){
        showToast("书签数据异常");
    }
};


//初始化
renderList();
renderHistory();


//页面加载恢复上次阅读文章
(function restoreLastArticle(){
    const raw = localStorage.getItem(LAST_ART_KEY);
    if(!raw) return;
    try{
        const obj = JSON.parse(raw);
        if(obj.aid){
            openArticleByAid(obj.aid);
        }
    }catch(e){}
})();
</script>
